<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>LoRA Manager</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      /* Pre-paint theme bootstrap (kept tiny; mirrors src/themes/registry.ts).
         Applies the stored theme/density before the first paint so there is
         no light/dark flash. Storage keys: lm-ui.theme, lm-ui.theme.user,
         lm-ui.density, lm-ui.scale, lm-ui.highlight.vars (written by
         src/composables/useAppearance.ts from lm-ui.highlight). */
      (function () {
        var root = document.documentElement
        function read(key) {
          try { return window.localStorage.getItem(key) } catch (e) { return null }
        }
        var choice = read('lm-ui.theme') || 'system'
        var dark = false
        try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches } catch (e) {}
        var theme = choice === 'system' ? (dark ? 'default-dark' : 'default-light') : choice
        var user = null
        try { user = JSON.parse(read('lm-ui.theme.user') || 'null') } catch (e) {}
        if (user && user.id === theme && typeof user.href === 'string' && /^user-themes\/[\w.-]+\.css$/.test(user.href)) {
          var link = document.createElement('link')
          link.rel = 'stylesheet'
          link.href = user.href
          link.setAttribute('data-user-theme', user.id)
          document.head.appendChild(link)
          root.style.colorScheme = user.scheme === 'dark' ? 'dark' : 'light'
        }
        root.setAttribute('data-theme', theme)
        var density = read('lm-ui.density')
        root.setAttribute('data-density', density === 'compact' ? 'compact' : 'comfortable')
        var scale = read('lm-ui.scale')
        root.setAttribute('data-scale', /^(s|m|l|xl)$/.test(scale || '') ? scale : 'm')
        // Highlight colour: pre-resolved accent tokens, built-in themes only.
        if (theme === 'default-light' || theme === 'default-dark') {
          var vars = null
          try { vars = JSON.parse(read('lm-ui.highlight.vars') || 'null') } catch (e) {}
          var set = vars && vars[theme === 'default-dark' ? 'dark' : 'light']
          var props = { accent: '--lm-color-accent', accentHover: '--lm-color-accent-hover', accentSoft: '--lm-color-accent-soft', onAccent: '--lm-color-on-accent' }
          var valid = !!set
          for (var key in props) {
            if (valid && !(typeof set[key] === 'string' && /^(#[0-9a-f]{3,8}|rgba?\([\d\s.,%/]+\))$/i.test(set[key]))) valid = false
          }
          if (valid) for (key in props) root.style.setProperty(props[key], set[key])
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>The LoRA Manager UI needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
